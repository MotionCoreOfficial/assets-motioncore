name: Temporary Nested Source Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-yanto-nested-audit.yml"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect nested referenced sources
        shell: bash
        run: |
          mkdir -p nested
          curl -L -A "Mozilla/5.0" --connect-timeout 15 --max-time 60 -sS -o nested/HugV9Owy.lua "https://pastefy.app/HugV9Owy/raw" || true
          curl -L -A "Mozilla/5.0" --connect-timeout 15 --max-time 60 -sS -o nested/upio-source.lua "https://upio-github-mirror.pages.dev/source.lua" || true
          wc -c nested/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: yanto-nested-external-sources
          path: nested/
          retention-days: 1
