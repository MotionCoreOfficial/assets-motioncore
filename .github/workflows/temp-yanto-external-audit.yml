          fetch "freeVD-yanto.lua" "https://yantohub.my.id/freeVD-yanto"
          fetch "Library.lua" "https://raw.githubusercontent.com/YantoRoblox/ObsidianHUB/main/Library.lua"
          fetch "ThemeManager.lua" "https://raw.githubusercontent.com/YantoRoblox/ObsidianHUB/main/addons/ThemeManager.lua"
          fetch "SaveManager.lua" "https://raw.githubusercontent.com/YantoRoblox/ObsidianHUB/main/addons/SaveManager.lua"

      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: yanto-external-sources
          path: external/
          if-no-files-found: error
          retention-days: 1
