name: Temporary Yanto External Source Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-yanto-external-audit.yml"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect referenced external sources
        shell: bash
        run: |
          set -u
          mkdir -p external
          : > external/MANIFEST.tsv

          fetch() {
            name="$1"
            url="$2"
            code=$(curl -L -A "Mozilla/5.0 MotionCoreAudit/1.0" --connect-timeout 15 --max-time 60 -sS -o "external/$name" -w "%{http_code}" "$url" || true)
            size=$(wc -c < "external/$name" 2>/dev/null || echo 0)
            printf "%s\t%s\t%s\t%s\n" "$name" "$code" "$size" "$url" >> external/MANIFEST.tsv
          }

          fetch "0ZjySeEr.lua" "https://pastefy.app/0ZjySeEr/raw"
          fetch "13ZJLyaU.lua" "https://pastefy.app/13ZJLyaU/raw"
          fetch "303r3rqM.lua" "https://pastefy.app/303r3rqM/raw"
          fetch "34MgSK8l.lua" "https://pastefy.app/34MgSK8l/raw"
          fetch "3KLw1pdF.lua" "https://pastefy.app/3KLw1pdF/raw"
          fetch "4b72i5Zr.lua" "https://pastefy.app/4b72i5Zr/raw"
          fetch "7EUCTRGo.lua" "https://pastefy.app/7EUCTRGo/raw"
          fetch "D4enVjWM.lua" "https://pastefy.app/D4enVjWM/raw"
          fetch "GywcfmIW.lua" "https://pastefy.app/GywcfmIW/raw"
          fetch "IQL8IRPm.lua" "https://pastefy.app/IQL8IRPm/raw"
          fetch "JLiaXcBk.lua" "https://pastefy.app/JLiaXcBk/raw"
          fetch "JiT6pBj9.lua" "https://pastefy.app/JiT6pBj9/raw"
          fetch "PVsCUKKh.lua" "https://pastefy.app/PVsCUKKh/raw"
          fetch "Ps9iq4CF.lua" "https://pastefy.app/Ps9iq4CF/raw"
          fetch "PzcZCCFd.lua" "https://pastefy.app/PzcZCCFd/raw"
          fetch "UJ6CcWQ0.lua" "https://pastefy.app/UJ6CcWQ0/raw"
          fetch "b4rog4GW.lua" "https://pastefy.app/b4rog4GW/raw"
          fetch "bk2yOIPD.lua" "https://pastefy.app/bk2yOIPD/raw"
          fetch "cLyPURnY.lua" "https://pastefy.app/cLyPURnY/raw"
          fetch "gR7wyUhn.lua" "https://pastefy.app/gR7wyUhn/raw"
          fetch "gUiYKCjv.lua" "https://pastefy.app/gUiYKCjv/raw"
          fetch "iTW3Yb1p.lua" "https://pastefy.app/iTW3Yb1p/raw"
          fetch "lgqPWBY1.lua" "https://pastefy.app/lgqPWBY1/raw"
          fetch "lszny0aM.lua" "https://pastefy.app/lszny0aM/raw"
          fetch "qWfkgEIH.lua" "https://pastefy.app/qWfkgEIH/raw"
          fetch "qXguuVZf.lua" "https://pastefy.app/qXguuVZf/raw"
          fetch "qmA5i4Pi.lua" "https://pastefy.app/qmA5i4Pi/raw"
          fetch "rNMIQIas.lua" "https://pastefy.app/rNMIQIas/raw"
          fetch "tM3CUafn.lua" "https://pastefy.app/tM3CUafn/raw"
          fetch "ueP9mYDB.lua" "https://pastefy.app/ueP9mYDB/raw"
          fetch "uzdz6pWf.lua" "https://pastefy.app/uzdz6pWf/raw"
